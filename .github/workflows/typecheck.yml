name: Typecheck

# Filet de sécurité : le typecheck TypeScript tourne sur TOUTE PR et sur
# chaque push main (plus seulement les chemins migrations/repas). Toute
# régression de types — notamment une table disparue de types.ts et utilisée
# par du code — casse immédiatement la CI, de façon visible.
#
# Ce n'est PAS la solution principale (voir supabase-types.yml + la génération
# officielle depuis la base) : c'est le garde-fou côté code.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Garde-fou du contrat offline (audit 30/08) : toute table branchée sur
      # `createOfflineRepository` DOIT avoir id/user_id/created_at/updated_at
      # en base, sinon tous ses `create` échouent en boucle (bugs prod
      # `exercises` puis `shopping_list`). Le typecheck ci-dessus le bloque
      # déjà au niveau des types ; ce script nomme la table et la colonne
      # manquante, pour que l'échec CI soit lisible sans relire le diff.
      - name: Contrat offline (createOfflineRepository)
        run: npm run check:offline-contract
